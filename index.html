<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mölkky AR sans marqueur</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <style>
    :root { --panel: rgba(20, 16, 14, 0.88); --ink: #f4ecdf; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .hud {
      position: fixed; left: 0; right: 0; z-index: 10;
      padding: 12px 16px; text-align: center; pointer-events: none;
    }
    .top { top: 0; background: linear-gradient(rgba(0,0,0,0.6), transparent); }
    .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0)); }
    .pill {
      display: inline-block; background: var(--panel); border-radius: 20px;
      padding: 8px 18px; font-size: 14px; border: 1px solid rgba(255,255,255,0.12);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="hud top">
    <div class="pill" id="statusMsg">Scanne le sol avec la caméra, puis clique pour poser le jeu</div>
  </div>
  <div class="hud bottom">
    <div class="pill" id="actionMsg">Mode placement</div>
  </div>

  <a-scene 
    webxr="optionalFeatures: hit-test, local-floor;"
    ar-hit-test="target: #reticle; type: map;"
    renderer="antialias: true; alpha: true"
    vr-mode-ui="enabled: false">
    
    <!-- Lumières adaptées pour l'AR -->
    <a-entity light="type: ambient; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; position: 1 3 1;"></a-entity>

    <!-- Réticule de visée sur le sol réel -->
    <a-entity id="reticle" rotation="-90 0 0">
      <a-ring radius-inner="0.1" radius-outer="0.12" color="#ffffff" opacity="0.8"></a-ring>
    </a-entity>

    <!-- Scène du Mölkky (invisible au départ, placée au clic) -->
    <a-entity id="gameRig" visible="false">
      <a-entity id="pins"></a-entity>
      <a-box id="stick" width="0.05" height="0.05" depth="0.4" color="#c98a4b" position="0 0.05 1.3"></a-box>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const LAYOUT = [
      [0, -1.00, 1], [-0.15, -0.85, 2], [0.15, -0.85, 3],
      [-0.30, -0.65, 4], [0, -0.70, 5], [0.30, -0.65, 6],
      [-0.45, -0.45, 7], [-0.15, -0.50, 8], [0.15, -0.50, 9],
      [0.45, -0.45, 10], [-0.60, -0.25, 11], [0.60, -0.25, 12]
    ];
    const HIT_R = 0.16;
    const STICK_START = { x: 0, y: 0.05, z: 1.3 };

    let pins = [];
    let stick = { vx: 0, vz: 0, moving: false, hits: new Set() };
    let isPlaced = false;
    let grabbing = false;
    let drag = null;

    const $ = id => document.getElementById(id);
    const scene = document.querySelector('a-scene');
    const reticle = $('reticle');
    const gameRig = $('gameRig');

    function buildPins() {
      const wrap = $('pins');
      wrap.innerHTML = '';
      pins = [];

      LAYOUT.forEach(([x, z, num]) => {
        const h = 0.14 + (num * 0.015);
        const g = document.createElement('a-entity');
        g.setAttribute('position', `${x} 0 ${z}`);

        const body = document.createElement('a-cylinder');
        body.setAttribute('radius', 0.035);
        body.setAttribute('height', h);
        body.setAttribute('position', `0 ${h / 2} 0`);
        body.setAttribute('color', '#d1a875');

        const label = document.createElement('a-text');
        label.setAttribute('value', num);
        label.setAttribute('align', 'center');
        label.setAttribute('color', '#241a10');
        label.setAttribute('width', 2);
        label.setAttribute('position', `0 ${h + 0.04} 0`);
        label.setAttribute('rotation', '-90 0 0');

        g.appendChild(body);
        g.appendChild(label);
        wrap.appendChild(g);
        pins.push({ el: g, x, z, num, standing: true });
      });
    }

    buildPins();

    function resetStick() {
      stick.vx = 0; stick.vz = 0; stick.moving = false; stick.hits = new Set();
      $('stick').setAttribute('position', { ...STICK_START });
    }

    function beginThrow(dx, dy) {
      if (stick.moving) return;
      const power = Math.min(Math.max(Math.hypot(dx, dy) / 60, 0.5), 1.8);
      const aim = Math.max(-0.6, Math.min(0.6, -dx / 140));
      stick.vx = aim * power;
      stick.vz = -power;
      stick.moving = true;
      stick.hits = new Set();
      $('actionMsg').textContent = 'Lancé !';
    }

    // Boucle physique du bâton
    setInterval(() => {
      if (!stick.moving) return;
      const el = $('stick');
      const pos = el.getAttribute('position');

      pos.x += stick.vx * 0.05;
      pos.z += stick.vz * 0.05;
      stick.vx *= 0.93;
      stick.vz *= 0.93;
      el.setAttribute('position', pos);

      pins.forEach(p => {
        if (p.standing && !stick.hits.has(p.num)) {
          const d = Math.hypot(pos.x - p.x, pos.z - p.z);
          if (d < HIT_R) {
            stick.hits.add(p.num);
            knockPin(p);
          }
        }
      });

      const speed = Math.hypot(stick.vx, stick.vz);
      if (speed < 0.02 || pos.z < -1.35 || Math.abs(pos.x) > 1.2) {
        stick.moving = false;
        finishThrow();
      }
    }, 16);

    function knockPin(p) {
      p.standing = false;
      p.el.setAttribute('animation', 'property: rotation; to: 75 0 35; dur: 220; easing: easeOutQuad');
    }

    function standPin(p) {
      p.standing = true;
      p.el.setAttribute('animation', 'property: rotation; to: 0 0 0; dur: 260; easing: easeOutQuad');
    }

    function finishThrow() {
      const n = stick.hits.size;
      $('actionMsg').textContent = n > 0 ? `${n} quille${n > 1 ? 's' : ''} touchée${n > 1 ? 's' : ''} !` : 'Raté.';
      setTimeout(() => {
        pins.forEach(p => { if (!p.standing) standPin(p); });
        resetStick();
        setTimeout(() => $('actionMsg').textContent = "Glisse vers le haut pour lancer", 600);
      }, 800);
    }

    // Projection 3D -> écran pour détecter le touch sur le bâton
    function projectStick() {
      if (!scene || !scene.camera) return null;
      const el = $('stick');
      const v = new THREE.Vector3();
      el.object3D.getWorldPosition(v);
      v.project(scene.camera);
      return {
        x: (v.x * 0.5 + 0.5) * window.innerWidth,
        y: (-v.y * 0.5 + 0.5) * window.innerHeight
      };
    }

    // Interaction : placement du jeu OU lancer du bâton
    window.addEventListener('pointerdown', e => {
      if (!isPlaced) {
        // Positionne le terrain à l'endroit visé par le réticule
        const hitPos = reticle.getAttribute('position');
        if (reticle.getAttribute('visible') !== false && hitPos) {
          gameRig.setAttribute('position', hitPos);
          gameRig.setAttribute('visible', 'true');
          reticle.setAttribute('visible', 'false');
          isPlaced = true;
          $('statusMsg').textContent = 'Partie en cours';$('actionMsg').textContent = "Glisse vers le haut pour lancer";
        }
        return;
      }

      if (stick.moving) return;
      const sp = projectStick();
      if (!sp) return;
      if (Math.hypot(e.clientX - sp.x, e.clientY - sp.y) < 80) {
        grabbing = true;
        drag = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('pointerup', e => {
      if (!grabbing) return;
      grabbing = false;
      beginThrow(e.clientX - drag.x, drag.y - e.clientY);
    });
  </script>
</body>
</html>
