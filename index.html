<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mölkky AR avec Sol</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <style>
    :root { --panel: rgba(20, 16, 14, 0.88); --ink: #f4ecdf; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #111; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .hud {
      position: fixed; left: 0; right: 0; z-index: 10;
      padding: 12px 16px; text-align: center; pointer-events: none;
    }
    .top { top: 0; background: linear-gradient(rgba(0,0,0,0.65), transparent); }
    .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0)); }
    .pill {
      display: inline-block; background: var(--panel); border-radius: 20px;
      padding: 8px 18px; font-size: 14px; border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

  <div class="hud top">
    <div class="pill" id="statusMsg">Partie prête</div>
  </div>
  <div class="hud bottom">
    <div class="pill" id="actionMsg">Glisse vers le haut pour lancer</div>
  </div>

  <a-scene 
    webxr="optionalFeatures: hit-test, local-floor;"
    renderer="antialias: true; alpha: true"
    vr-mode-ui="enabled: false">
    
    <!-- Éclairage réaliste avec ombres douces -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.85;"></a-entity>
    <a-entity light="type: directional; color: #fff5e6; intensity: 0.9; position: 2 4 3;"></a-entity>

    <!-- Zone de jeu complète avec le sol -->
    <a-entity id="gameRig" position="0 0 -0.5">
      <!-- Sol / Pelouse sous les quilles -->
      <a-circle 
        rotation="-90 0 0" 
        radius="1.6" 
        color="#346838" 
        roughness="0.9"
        shadow="receive: true">
      </a-circle>

      <!-- Cercle de délimitation visuelle -->
      <a-ring 
        rotation="-90 0 0" 
        position="0 0.002 0"
        radius-inner="1.58" 
        radius-outer="1.62" 
        color="#e5c18b" 
        opacity="0.6">
      </a-ring>

      <!-- Quilles -->
      <a-entity id="pins"></a-entity>

      <!-- Bâton de lancer (Mölkky) -->
      <a-box 
        id="stick" 
        width="0.05" 
        height="0.05" 
        depth="0.4" 
        color="#c98a4b" 
        position="0 0.05 1.1">
      </a-box>
    </a-entity>

    <!-- Caméra en plongée pour voir le sol et les quilles posées dessus -->
    <a-entity id="cameraRig" position="0 1.1 1.6" rotation="-26 0 0">
      <a-camera look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
    </a-entity>
  </a-scene>

  <script>
    const LAYOUT = [
      [0, -0.90, 1], [-0.15, -0.75, 2], [0.15, -0.75, 3],
      [-0.30, -0.55, 4], [0, -0.60, 5], [0.30, -0.55, 6],
      [-0.45, -0.35, 7], [-0.15, -0.40, 8], [0.15, -0.40, 9],
      [0.45, -0.35, 10], [-0.60, -0.15, 11], [0.60, -0.15, 12]
    ];
    const HIT_R = 0.16;
    const STICK_START = { x: 0, y: 0.05, z: 1.1 };

    let pins = [];
    let stick = { vx: 0, vz: 0, moving: false, hits: new Set() };
    let grabbing = false;
    let drag = null;

    const $ = id => document.getElementById(id);
    const scene = document.querySelector('a-scene');

    function buildPins() {
      const wrap = $('pins');
      wrap.innerHTML = '';
      pins = [];

      LAYOUT.forEach(([x, z, num]) => {
        const h = 0.16 + (num * 0.012);
        const g = document.createElement('a-entity');
        g.setAttribute('position', `${x} 0 ${z}`);

        // Cylindre de la quille (biseauté en haut)
        const body = document.createElement('a-cylinder');
        body.setAttribute('radius', 0.038);
        body.setAttribute('height', h);
        body.setAttribute('position', `0 ${h / 2} 0`);
        body.setAttribute('color', '#dfb887');
        body.setAttribute('roughness', '0.6');

        // Numéro inscrit sur le dessus
        const label = document.createElement('a-text');
        label.setAttribute('value', num);
        label.setAttribute('align', 'center');
        label.setAttribute('color', '#2d1806');
        label.setAttribute('width', 2.2);
        label.setAttribute('position', `0 ${h + 0.02} 0`);
        label.setAttribute('rotation', '-90 0 0');

        g.appendChild(body);
        g.appendChild(label);
        wrap.appendChild(g);
        pins.push({ el: g, x, z, num, standing: true });
      });
    }

    buildPins();

    function resetStick() {
      stick.vx = 0; stick.vz = 0; stick.moving = false; stick.hits = new Set();
      $('stick').setAttribute('position', { ...STICK_START });
    }

    function beginThrow(dx, dy) {
      if (stick.moving) return;
      const power = Math.min(Math.max(Math.hypot(dx, dy) / 60, 0.6), 1.9);
      const aim = Math.max(-0.65, Math.min(0.65, -dx / 130));
      stick.vx = aim * power;
      stick.vz = -power;
      stick.moving = true;
      stick.hits = new Set();
      $('actionMsg').textContent = 'Lancé !';
    }

    // Physique du lancer
    setInterval(() => {
      if (!stick.moving) return;
      const el = $('stick');
      const pos = el.getAttribute('position');

      pos.x += stick.vx * 0.05;
      pos.z += stick.vz * 0.05;
      stick.vx *= 0.93;
      stick.vz *= 0.93;
      el.setAttribute('position', pos);

      pins.forEach(p => {
        if (p.standing && !stick.hits.has(p.num)) {
          const d = Math.hypot(pos.x - p.x, pos.z - p.z);
          if (d < HIT_R) {
            stick.hits.add(p.num);
            knockPin(p);
          }
        }
      });

      const speed = Math.hypot(stick.vx, stick.vz);
      if (speed < 0.02 || pos.z < -1.3 || Math.abs(pos.x) > 1.3) {
        stick.moving = false;
        finishThrow();
      }
    }, 16);

    function knockPin(p) {
      p.standing = false;
      p.el.setAttribute('animation', 'property: rotation; to: 78 0 35; dur: 220; easing: easeOutQuad');
    }

    function standPin(p) {
      p.standing = true;
      p.el.setAttribute('animation', 'property: rotation; to: 0 0 0; dur: 260; easing: easeOutQuad');
    }

    function finishThrow() {
      const n = stick.hits.size;
      $('actionMsg').textContent = n > 0 ? `${n} quille${n > 1 ? 's' : ''} touchée${n > 1 ? 's' : ''} !` : 'Raté.';
      setTimeout(() => {
        pins.forEach(p => { if (!p.standing) standPin(p); });
        resetStick();
        setTimeout(() => $('actionMsg').textContent = "Glisse vers le haut pour lancer", 600);
      }, 900);
    }

    function projectStick() {
      const camEl = document.querySelector('a-camera');
      if (!camEl || !camEl.components.camera) return null;
      const el = $('stick');
      const v = new THREE.Vector3();
      el.object3D.getWorldPosition(v);
      v.project(camEl.components.camera.camera);
      return {
        x: (v.x * 0.5 + 0.5) * window.innerWidth,
        y: (-v.y * 0.5 + 0.5) * window.innerHeight
      };
    }

    window.addEventListener('pointerdown', e => {
      if (stick.moving) return;
      const sp = projectStick();
      if (!sp) return;
      if (Math.hypot(e.clientX - sp.x, e.clientY - sp.y) < 110) {
        grabbing = true;
        drag = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('pointerup', e => {
      if (!grabbing) return;
      grabbing = false;
      beginThrow(e.clientX - drag.x, drag.y - e.clientY);
    });
  </script>
</body>
</html>
